<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Agent Office</title>
    <style>
      html, body { height: 100%; margin: 0; background: #0e1117; color: #8b93a3; font: 14px ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
      body { display: grid; place-items: center; }
      .dot { display: inline-block; width: 8px; height: 8px; margin-right: 8px; border-radius: 50%; background: #39ff88; animation: pulse 1s infinite alternate; }
      @keyframes pulse { to { opacity: 0.2; } }
    </style>
  </head>
  <body>
    <div id="status"><span class="dot"></span>Starting Agent Office…</div>
    <script>
      if (new URLSearchParams(location.search).has("error")) {
        document.getElementById("status").textContent =
          "Agent Office could not start its collector. Check the app logs and local security software.";
      }
    </script>
  </body>
</html>
