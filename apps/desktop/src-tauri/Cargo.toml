[package]
name = "agent-office"
version = "0.4.1"
description = "3D live view of every coding agent working on this machine"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
# generate_context! parses the plugins block in tauri.conf.json with serde_json,
# so it has to be a direct dependency even though no code here names it.
serde_json = "1"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
