name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  check:
    name: Typecheck & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck all workspaces
        run: bun run typecheck

      - name: Run test suite
        run: bun test

  rust:
    name: Rust (${{ matrix.app }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [desktop, mobile]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/${{ matrix.app }}/src-tauri

      - name: Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev file \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # tauri-build needs the configured web resources and collector sidecar to exist.
      - name: Prepare desktop resources
        if: matrix.app == 'desktop'
        run: bun run --filter @agent-office/desktop prepare-app

      - name: Prepare mobile frontend
        if: matrix.app == 'mobile'
        run: bun run --filter @agent-office/mobile build

      # The mobile crate is checked on the Linux host; Android builds stay in Apps.
      - name: Check Rust
        working-directory: apps/${{ matrix.app }}/src-tauri
        run: cargo check --locked
